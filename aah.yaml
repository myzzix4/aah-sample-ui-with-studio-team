# AAH Code Deploy Sample #3 — UI + Studio Team
# 직접 개발한 UI (Flask). Team 은 AAH Agent Team Studio 에서 만든 결과물의 baked ARN 사용.
# multi-agent workflow (parallel_fork / aggregator / supervisor 등) 가 컨테이너 안에서 실행됨.
apiVersion: aah.dev/v1
kind: AgentDeployment

metadata:
  name: aah-sample-ui-with-studio-team
  display_name: "샘플 #3 · UI + Studio Team"
  description: |
    삼성생명 데모 홈페이지(Flask). AAH Agent Team Studio 에서 만든 multi-agent
    Team 의 ARN 을 AGENT_RUNTIME_ARN env 로 받아 호출. 컨테이너 안에서
    여러 specialist 가 협업하는 결과를 UI 가 한 답변으로 표시.
  domain: insurance
  tags: [ui, studio-team, multi-agent, sample, samsung-life]

services:
  - id: ui
    kind: web_service
    target: app_runner
    dockerfile: ./services/ui/Dockerfile
    port: 8000
    health_path: /healthz
    requirements:
      cpu: "0.25 vCPU"
      memory: "0.5 GB"
      min_instances: 1
      max_instances: 4

resources: []

env_by_service:
  ui:
    - { name: AGENT_RUNTIME_ARN, default: "" }
    - { name: AWS_REGION,        default: "us-east-1" }
    - { name: UI_TITLE,          default: "삼성생명 AI 협업 상담 (Multi-Agent)" }
    - { name: UI_SCENARIO,       default: "샘플 #3 · UI + Studio Team" }
    - { name: LOG_LEVEL,         default: "INFO" }
